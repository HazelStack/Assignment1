<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me</title>
  <link rel="stylesheet" href="styles1.css">
</head>
<body>

  <!--Navigation Bar-->
  <nav>
    <ul>
      <li><a href="./index.html">Home</a></li>
      <li><a href="./contactMe.html">Contact Me</a></li>
    </ul>
  </nav>

  <!--Form Section-->
  <h2>Contact Form</h2>
  <form method="get" action="index.html">
    <!--First Name-->
    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="firstName" />

    <!--Last Name-->
    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="lastName" />

    <!--Checkbox-->
    <label>
      <input type="checkbox" id="subscribe" name="subscribe" value="yes" />
      Subscribe to newsletter
    </label>

    <!--Radio Buttons-->
    <p>Gender:</p>
    <label><input type="radio" id="male" name="gender" value="male" /> Male</label>
    <label><input type="radio" id="female" name="gender" value="female" /> Female</label>
    <label><input type="radio" id="prefer-not" name="gender" value="prefer-not" /> Prefer not to say</label>

    <br><br>
    <!--Submit Button-->
    <input type="submit" value="Submit" />
  </form>

</body>
</html>
