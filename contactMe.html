<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles1.css">
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./contactMe.html">Contact Me</a></li>
      </ul>
    </nav>
    <h2>Contact Form</h2>
    <form method="get" action="index.html">
      <label for="first-name">First Name:</label>
      <input type="text" id="first-name" name="firstName" />
      <label for="last-name">Last Name:</label>
      <input type="text" id="last-name" name="lastName" />
      <label>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes" />
        Subscribe to newsletter
      </label>
      <p>Gender:</p>
      <label>
        <input type="radio" id="male" name="gender" value="male" />
        Male
      </label>
      <label>
        <input type="radio" id="female" name="gender" value="female" />
        Female
      </label>
      <label>
        <input type="radio" id="prefer-not" name="gender" value="prefer-not" />
        Prefer not to say
      </label>
      <input type="submit" value="Submit" />
    </form>
    <footer class="footer">
      <p>
        Social Media: 
        <a href="https://www.linkedin.com/in/harevalo123/" target="_blank">LinkedIn</a>
      </p>
    </footer>
  </body>
</html>
